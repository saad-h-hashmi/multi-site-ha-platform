# Monitoring stack: Prometheus + kube-state-metrics.
# Grafana was evaluated and removed: ~700 MB per node on a 20 GB disk caused
# kubelet disk-pressure evictions (see docs/ARCHITECTURE_DECISIONS.md AD-11).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - kube-state-metrics.yaml
  - prometheus.yaml
images:
  - { name: PROMETHEUS_IMAGE, newName: prom/prometheus, newTag: v3.5.0 }
  - { name: KSM_IMAGE, newName: registry.k8s.io/kube-state-metrics/kube-state-metrics, newTag: v2.17.0 }
