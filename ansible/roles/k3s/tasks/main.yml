---
# Phase 4: three K3s servers (embedded etcd, one per site) + one agent per site.
# Servers start one at a time: etcd membership changes must be sequential, and
# starting all six at once would saturate the 2 vCPUs.
- name: Detect the VM's primary IP (added to the API certificate for Windows access)
  ansible.builtin.set_fact:
    host_ip: "{{ ansible_facts.default_ipv4.address | default('') }}"

- name: Build the node list
  ansible.builtin.set_fact:
    k3s_servers: "{{ k3s_servers | default([]) + [{'name': item.name ~ '-server', 'role': 'server', 'ip': item.server_ip, 'site': item}] }}"
    k3s_agents: "{{ k3s_agents | default([]) + [{'name': item.name ~ '-agent', 'role': 'agent', 'ip': item.agent_ip, 'site': item}] }}"
  loop: "{{ sites }}"
  loop_control: { label: "{{ item.name }}" }

- name: Wait for the first server's API before adding more nodes
  ansible.builtin.include_tasks: node.yml
  vars:
    node: "{{ k3s_servers[0] }}"
    kubectl_via: "{{ k3s_servers[0].name }}"

- name: Join the remaining servers (one at a time)
  ansible.builtin.include_tasks: node.yml
  loop: "{{ k3s_servers[1:] }}"
  loop_control: { loop_var: node, label: "{{ node.name }}" }
  vars:
    kubectl_via: "{{ k3s_servers[0].name }}"

- name: Join the agents
  ansible.builtin.include_tasks: node.yml
  loop: "{{ k3s_agents }}"
  loop_control: { loop_var: node, label: "{{ node.name }}" }
  vars:
    kubectl_via: "{{ k3s_servers[0].name }}"

- name: Verify etcd is healthy on every server (etcd's own /health endpoint)
  ansible.builtin.command: docker exec {{ project_name }}-{{ item.name }} wget -qO- http://127.0.0.1:2381/health
  register: etcd_health
  until: etcd_health.rc == 0 and '"health":"true"' in etcd_health.stdout
  retries: 12
  delay: 5
  changed_when: false
  loop: "{{ k3s_servers }}"
  loop_control: { label: "{{ item.name }}" }

- name: Fetch the admin kubeconfig
  ansible.builtin.command: docker exec {{ project_name }}-{{ k3s_servers[0].name }} cat /etc/rancher/k3s/k3s.yaml
  register: raw_kubeconfig
  changed_when: false
  no_log: true

- name: Write kubeconfig for this VM (API through the edge load balancer)
  ansible.builtin.copy:
    dest: "{{ build_dir }}/kubeconfig"
    mode: "0600"
    content: "{{ raw_kubeconfig.stdout
                 | replace('https://127.0.0.1:6443', 'https://127.0.0.1:' ~ edge.api_port)
                 | replace(': default', ': ' ~ project_name) }}"
  no_log: true

- name: Write kubeconfig for the Windows host (API through the VM's IP)
  ansible.builtin.copy:
    dest: "{{ build_dir }}/kubeconfig-windows"
    mode: "0600"
    content: "{{ raw_kubeconfig.stdout
                 | replace('https://127.0.0.1:6443', 'https://' ~ host_ip ~ ':' ~ edge.api_port)
                 | replace(': default', ': ' ~ project_name) }}"
  no_log: true
  when: host_ip | length > 0

- name: Cluster summary
  ansible.builtin.command: kubectl --kubeconfig {{ build_dir }}/kubeconfig get nodes -o wide
  register: nodes_out
  changed_when: false

- name: Show nodes
  ansible.builtin.debug:
    var: nodes_out.stdout_lines
