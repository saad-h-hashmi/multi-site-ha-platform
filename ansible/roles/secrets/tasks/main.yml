---
# Generates every secret the lab needs into .secrets/ (git-ignored, mode 0700).
# Existing secrets are reused, so reruns are idempotent and the cluster keeps
# working across `make deploy` runs. Delete .secrets/ only for a full reset.
- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0700"

- name: Generate (or reuse) random secrets
  ansible.builtin.set_fact:
    k3s_token: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/k3s-token chars=ascii_letters,digits length=48') }}"
    redis_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/redis-password chars=ascii_letters,digits length=32') }}"
    haproxy_stats_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/haproxy-stats-password chars=ascii_letters,digits length=20') }}"
  no_log: true

- name: Generate a WireGuard private key per site router (only if missing)
  ansible.builtin.shell: umask 077 && wg genkey > "{{ secrets_dir }}/wg-{{ item.id }}.key"
  args:
    creates: "{{ secrets_dir }}/wg-{{ item.id }}.key"
  loop: "{{ sites }}"
  loop_control: { label: "router-{{ item.id }}" }

- name: Derive WireGuard public keys
  ansible.builtin.shell: wg pubkey < "{{ secrets_dir }}/wg-{{ item.id }}.key"
  register: wg_pub
  changed_when: false
  loop: "{{ sites }}"
  loop_control: { label: "router-{{ item.id }}" }

- name: Record WireGuard public keys
  ansible.builtin.set_fact:
    wg_public_keys: "{{ dict(wg_pub.results | map(attribute='item.id') | zip(wg_pub.results | map(attribute='stdout'))) }}"

- name: Make sure secret files are private
  ansible.builtin.file:
    path: "{{ secrets_dir }}/{{ item }}"
    mode: "0600"
  loop: [k3s-token, redis-password, haproxy-stats-password, wg-a.key, wg-b.key, wg-c.key]
