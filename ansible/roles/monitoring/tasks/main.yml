---
# Lightweight monitoring: Prometheus + kube-state-metrics.
# (Grafana was evaluated and removed for disk reasons; see AD-11.)
- name: Ensure the monitoring namespace exists
  ansible.builtin.command: kubectl apply -k {{ project_root }}/kubernetes/platform
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  changed_when: false

- name: Apply the monitoring stack
  ansible.builtin.command: kubectl apply -k {{ project_root }}/monitoring
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  register: mon_apply
  changed_when: "'configured' in mon_apply.stdout or 'created' in mon_apply.stdout"

- name: Reload Prometheus when its configuration changed
  ansible.builtin.command: kubectl -n monitoring rollout restart deployment/prometheus
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  when: "'configmap/prometheus-config configured' in mon_apply.stdout"

- name: Wait for the monitoring stack
  ansible.builtin.command: kubectl -n monitoring rollout status deployment/{{ item }} --timeout=600s
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  loop: [kube-state-metrics, prometheus]
  changed_when: false

- name: Wait until Prometheus answers through the edge load balancer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ edge.prometheus_port }}/-/ready"
    status_code: 200
  register: edge_prom
  until: edge_prom.status == 200
  retries: 30
  delay: 4
