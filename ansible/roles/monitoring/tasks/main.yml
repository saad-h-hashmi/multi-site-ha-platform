---
# Lightweight monitoring: Prometheus + kube-state-metrics + Grafana.
- name: Ensure the monitoring namespace exists
  ansible.builtin.command: kubectl apply -k {{ project_root }}/kubernetes/platform
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  changed_when: false

- name: Create or update the Grafana admin Secret (value from .secrets/)
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n monitoring create secret generic grafana-admin \
      --from-file=password={{ secrets_dir }}/grafana-admin-password \
      --dry-run=client -o yaml | kubectl apply -f -
  args: { executable: /bin/bash }
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  register: grafana_secret
  changed_when: "'configured' in grafana_secret.stdout or 'created' in grafana_secret.stdout"

- name: Apply the monitoring stack
  ansible.builtin.command: kubectl apply -k {{ project_root }}/monitoring
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  register: mon_apply
  changed_when: "'configured' in mon_apply.stdout or 'created' in mon_apply.stdout"

- name: Reload Prometheus when its configuration changed
  ansible.builtin.command: kubectl -n monitoring rollout restart deployment/prometheus
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  when: "'configmap/prometheus-config configured' in mon_apply.stdout"

- name: Restart Grafana when its dashboards or provisioning changed
  ansible.builtin.command: kubectl -n monitoring rollout restart deployment/grafana
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  when: "'configmap/grafana-dashboards configured' in mon_apply.stdout or 'configmap/grafana-provisioning configured' in mon_apply.stdout or grafana_secret is changed"

- name: Wait for the monitoring stack
  ansible.builtin.command: kubectl -n monitoring rollout status deployment/{{ item }} --timeout=600s
  environment: { KUBECONFIG: "{{ build_dir }}/kubeconfig" }
  loop: [kube-state-metrics, prometheus, grafana]
  changed_when: false

- name: Wait until Grafana answers through the edge load balancer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ edge.grafana_port }}/api/health"
    status_code: 200
  register: edge_grafana
  until: edge_grafana.status == 200
  retries: 30
  delay: 4
