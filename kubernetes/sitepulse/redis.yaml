# Redis stores the visit counter on a PersistentVolume (K3s local-path storage).
# Single instance by design (see docs/HIGH_AVAILABILITY_DESIGN.md): if its node
# fails, the counter is unavailable until the node returns, but the web tier keeps
# serving (it degrades gracefully).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sitepulse
  labels: { app.kubernetes.io/name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sitepulse
  labels: { app.kubernetes.io/name: redis }
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: REDIS_IMAGE            # replaced by kustomize
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - "yes"                     # write every change to disk (durability)
            - --save
            - "60 1"
            - --maxmemory
            - 48mb
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-auth, key: password } }
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 96Mi }
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 256Mi }
