apiVersion: v1
kind: Service
metadata:
  name: sitepulse
  namespace: sitepulse
  labels: { app.kubernetes.io/name: sitepulse }
spec:
  selector: { app.kubernetes.io/name: sitepulse }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sitepulse
  namespace: sitepulse
  labels: { app.kubernetes.io/name: sitepulse }
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: sitepulse-retry@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: sitepulse.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: sitepulse, port: { name: http } } }
---
# Voluntary disruptions (node drain, upgrades) must leave at least 2 replicas serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sitepulse
  namespace: sitepulse
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: sitepulse }
