# K3s installs Traefik with a single replica. That would make ingress a single
# point of failure, so run one replica per site (3), protected by a PodDisruptionBudget.
#
# Traefik listens directly on port 80 of the node it runs on (hostPort), and its
# Service is ClusterIP, so K3s ServiceLB is not used for it. The edge load balancer
# therefore connects straight to a Traefik process:
#   * nodes without Traefik refuse the connection -> marked DOWN at the edge;
#   * a dead node times out after 500 ms -> the edge retries another node.
# Why: with ServiceLB, every node forwards port 80 through kube-proxy to ANY Traefik
# pod, including one on a node that has just died, and the request hangs. Measured in
# the second failover run (91 % availability during a worker failure). Setting
# externalTrafficPolicy: Local does not help, because ServiceLB forwards from a pod and
# kube-proxy treats that as internal traffic. That was tested, and the result was
# that all 6 nodes kept serving.
# K3s's Helm controller merges these values into its bundled chart.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 3
    podDisruptionBudget:
      enabled: true
      minAvailable: 2
    service:
      spec:
        type: ClusterIP          # chart 41.x: the type lives under service.spec
    ports:
      web:
        hostPort: 80
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        matchLabelKeys: [pod-template-hash]   # count only the current revision during rollouts
    additionalArguments:
      # Give up on an unreachable pod (e.g. on a failed node) after 0.5 s instead of
      # 30 s, so the retry middleware can send the request to a healthy replica.
      - --serversTransport.forwardingTimeouts.dialTimeout=500ms
    resources:
      requests: { cpu: 25m, memory: 48Mi }
      limits: { memory: 128Mi }
    tolerations:
      # leave a failed node quickly so the surviving replicas are not alone for long
      - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
