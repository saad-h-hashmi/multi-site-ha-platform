# Namespaces separate the application from monitoring. Pod Security Admission
# enforces the "restricted" profile for the app (non-root, no privilege
# escalation, dropped capabilities, seccomp).
apiVersion: v1
kind: Namespace
metadata:
  name: sitepulse
  labels:
    app.kubernetes.io/part-of: multi-site-ha-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: multi-site-ha-platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
